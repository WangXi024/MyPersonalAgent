server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ { include /etc/nginx/proxy-common.conf; }
    location /health/ { include /etc/nginx/proxy-common.conf; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    location /health/live { return 200 "ok\n"; }
    location / { return 308 https://$host$request_uri; }
}
