[project]
name = "learning-agent-backend"
version = "0.1.0"
description = "Durable learning personal agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.39,<2.1",
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "pydantic-ai-slim[openai,temporal]>=1,<3",
  "temporalio>=1.10,<2",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
